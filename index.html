<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 70px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; }
        input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }
        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
            padding: 12px;
            background: #eef7ee;
            border-radius: 7px;
            word-break: break-all;
        }
        .error { background: #ffecec !important; }
    </style>
</head>
<body>
<div class="box">
    <h1>Simple URL Shortener</h1>
    <p>Enter a long URL and generate a unique short code.</p>

    <input id="url" type="url" placeholder="https://example.com/very/long/url">
    <button onclick="shorten()">Shorten URL</button>

    <div id="result" style="display:none;"></div>
</div>

<script>
async function shorten() {
    const url = document.getElementById("url").value.trim();
    const result = document.getElementById("result");

    result.style.display = "block";
    result.className = "";

    if (!url) {
        result.textContent = "Please enter a URL.";
        result.className = "error";
        return;
    }

    try {
        const response = await fetch("/api/shorten", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({url})
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.error || "Something went wrong.";
            result.className = "error";
            return;
        }

        result.innerHTML =
            "Short URL: <a href=\"" + data.short_url + "\" target=\"_blank\">" +
            data.short_url + "</a><br><br>" +
            "Short Code: <b>" + data.short_code + "</b>";
    } catch (error) {
        result.textContent = "Server error. Make sure Flask is running.";
        result.className = "error";
    }
}
</script>
</body>
</html>
